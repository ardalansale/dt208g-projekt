<div class="schedule-container">
    <h2>Mitt Ramschema</h2>
    <p>Totala högskolepoäng: <strong>{{ totalPoints }} hp</strong></p>

    <table class="course-table">
        <thead>
        <tr>
            <th>Kod</th>
            <th>Kursnamn</th>
            <th>Poäng</th>
            <th>Ämne</th>
            <th>Handling</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let course of schedule">
            <td>{{ course.courseCode }}</td>
            <td>{{ course.courseName }}</td>
            <td>{{ course.points }} hp</td>
            <td>{{ course.subject }}</td>
            <td>
            <button (click)="removeCourse(course.courseCode)" class="btn btn-secondary">Ta bort</button>
            </td>
        </tr>
        <tr *ngIf="schedule.length === 0">
            <td colspan="5" style="text-align: center;">Ditt ramschema är tomt. Inga kurser tillagda än.</td>
        </tr>
        </tbody>
    </table>
</div>
